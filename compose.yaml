name: school-kernel-workspace

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: school_workspace
      POSTGRES_USER: school_workspace
      # Well-known local-only walkthrough credential. Never reuse it as a production secret.
      POSTGRES_PASSWORD: local_walkthrough_only
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_workspace -d school_workspace"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    volumes:
      - workspace-postgres-data:/var/lib/postgresql

volumes:
  workspace-postgres-data:
